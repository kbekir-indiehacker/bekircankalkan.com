</style></head><body><header><a href="/">Bekircan Kalkan</a></header><main><h1 class="sr">Bekircan Kalkan</h1><form id="search" role="search" action="/" method="get"><input id="q" name="q" type="search" placeholder="Yazılarda ara" aria-label="Yazılarda ara" autocomplete="off"></form><div id="results" aria-live="polite" hidden></div><div id="list"><article><h2><a href="/yazilar/gayret/">Gayret</a></h2><time datetime="2026-11-01T00:00:00.000Z">1 Kasım 2026</time></article></div></main></body></html><script type="module">
  import { prepare, search } from '/search.js';

  const input = document.getElementById('q');
  const results = document.getElementById('results');
  const list = document.getElementById('list');
  document.getElementById('search').addEventListener('submit', (e) => e.preventDefault());

  let indexPromise;
  const load = () => {
    indexPromise ??= fetch('/search.json')
      .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
      .then(prepare)
      .catch((e) => { indexPromise = undefined; throw e; });
    return indexPromise;
  };

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  let run = 0;
  async function update(raw) {
    const current = ++run;
    const q = raw.trim();
    const url = new URL(location.href);
    q ? url.searchParams.set('q', q) : url.searchParams.delete('q');
    history.replaceState(null, '', url);
    if (!q) {
      results.hidden = true;
      list.hidden = false;
      return;
    }
    let html;
    try {
      const items = search(await load(), q);
      html = items.length
        ? items.map((i) => `<article><h2><a href="${esc(i.url)}">${esc(i.title)}</a></h2><p>${i.excerpt}</p></article>`).join('')
        : '<p>Sonuç bulunamadı.</p>';
    } catch {
      html = '<p>Arama şu anda çalışmıyor.</p>';
    }
    if (current !== run) return;
    results.innerHTML = html;
    results.hidden = false;
    list.hidden = true;
  }

  input.addEventListener('focus', () => load().catch(() => {}), { once: true });
  input.addEventListener('input', () => update(input.value));
  const initial = new URLSearchParams(location.search).get('q');
  if (initial) { input.value = initial; update(initial); }
</script>
